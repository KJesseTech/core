<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Task App{% endblock %}</title>
    <style>
        body {
            margin: 0;
            font-family: Inter, Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #333;
        }
        .page {
            max-width: 900px;
            margin: 40px auto;
            padding: 24px;
            background: #fff;
            border-radius: 24px;
            box-shadow: 0 18px 60px rgba(43, 52, 69, 0.08);
        }
        h1 {
            margin-top: 0;
            font-size: 2rem;
            letter-spacing: -0.03em;
        }
        .actions {
            margin-top: 24px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        a.button, button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 18px;
            border-radius: 999px;
            font-weight: 600;
            text-decoration: none;
            border: 1px solid transparent;
            transition: transform 0.16s ease, box-shadow 0.16s ease, background-color 0.16s ease;
        }
        a.button {
            background: #3b82f6;
            color: #fff;
        }
        a.button:hover, button:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.18);
        }
        .secondary {
            background: #f8fafc;
            color: #334155;
            border-color: #cbd5e1;
        }
        .task-list {
            list-style: none;
            margin: 0;
            padding: 0;
        }
        .task-item {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 16px;
            align-items: center;
            padding: 18px 20px;
            border-radius: 18px;
            background: #f8fafc;
            margin-bottom: 12px;
            border: 1px solid #e2e8f0;
        }
        .task-item.completed {
            background: #eff6ff;
        }
        .task-title {
            margin: 0;
            font-size: 1rem;
            line-height: 1.5;
            word-break: break-word;
        }
        .task-title.completed {
            text-decoration: line-through;
            color: #64748b;
        }
        .task-meta {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }
        .small-button {
            background: #e2e8f0;
            color: #0f172a;
            font-size: 0.9rem;
            padding: 8px 12px;
        }
        .small-button:hover {
            background: #cbd5e1;
        }
        .form-card {
            padding: 24px;
            border-radius: 20px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
        }
        form p {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }
        input[type="text"], input[type="checkbox"] {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            background: #fff;
            outline: none;
            font-size: 1rem;
        }
        input[type="checkbox"] {
            width: auto;
            margin-right: 8px;
        }
        .form-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .form-actions {
            margin-top: 20px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        footer {
            margin-top: 30px;
            font-size: 0.95rem;
            color: #64748b;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="page">
        {% block content %}{% endblock %}
        <footer>Simple Django task app · Built for local development</footer>
    </div>
</body>
</html>
