{% extends 'base.html' %}

{% block title %}{% if form.instance.pk %}Edit{% else %}Create{% endif %} Task{% endblock %}

{% block content %}
    <div class="actions">
        <div>
            <h1>{% if form.instance.pk %}Edit{% else %}Create{% endif %} Task</h1>
        </div>
        <a href="{% url 'task_list' %}" class="button secondary">Back to List</a>
    </div>

    <div class="form-card">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="form-actions">
                <button type="submit" class="button">Save Task</button>
                <a href="{% url 'task_list' %}" class="button secondary">Cancel</a>
            </div>
        </form>
    </div>
{% endblock %}
