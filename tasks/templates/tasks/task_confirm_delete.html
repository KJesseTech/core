{% extends 'base.html' %}

{% block title %}Delete Task{% endblock %}

{% block content %}
    <div class="actions">
        <div>
            <h1>Delete Task</h1>
            <p>Are you sure you want to delete "{{ task.title }}"?</p>
        </div>
        <a href="{% url 'task_list' %}" class="button secondary">Back to List</a>
    </div>

    <div class="form-card">
        <form method="post">
            {% csrf_token %}
            <div class="form-actions">
                <button type="submit" class="button">Yes, Delete</button>
                <a href="{% url 'task_list' %}" class="button secondary">Cancel</a>
            </div>
        </form>
    </div>
{% endblock %}
